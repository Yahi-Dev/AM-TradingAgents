services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: amtrading
      POSTGRES_PASSWORD: amtrading
      POSTGRES_DB: amtrading
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["pg_isready", "-U", "amtrading"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata: