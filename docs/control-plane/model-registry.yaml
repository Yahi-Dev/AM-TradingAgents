# AM-TradingAgents — Model & Prompt Registry
# Single source of truth for provider, model role, physical model IDs,
# prompt versions, and configuration.
# Never scatter physical model IDs across business code — always reference roles.
# Schema version: 1.0

schema_version: "1.0"
last_updated: "2026-09-23"

# ---------------------------------------------------------------------------
# PROVIDERS
# ---------------------------------------------------------------------------
providers:

  anthropic:
    display_name: "Anthropic"
    api_compatible: "anthropic"
    base_url_env: "ANTHROPIC_API_KEY"
    notes: "Claude family — used for orchestration, validation, PR creation"

  local_slm:
    display_name: "Local SLM (llama-swap)"
    api_compatible: "openai"
    base_url_env: "LOCAL_SLM_URL"
    base_url_default: "http://127.0.0.1:8080/v1"
    notes: "Qwen3.8-27B local model — used for story implementation"

# ---------------------------------------------------------------------------
# MODEL ROLES
# Maps logical role → physical model.
# Change the physical_model here to upgrade; no business code changes needed.
# ---------------------------------------------------------------------------
model_roles:

  story_implementer:
    description: "Writes all story implementation code + tests"
    provider: local_slm
    physical_model: "qwen3.8-27b"
    model_version: "3.8-27b"
    temperature: 0.1
    max_tokens: 8192
    timeout_seconds: 300
    env_override: "LOCAL_SLM_MODEL"

  orchestrator:
    description: "Orchestrates the dev loop: picks stories, validates, creates PRs"
    provider: anthropic
    physical_model: "claude-sonnet-4-6"
    model_version: "sonnet-4-6"
    temperature: 0.0
    max_tokens: 4096
    env_override: null

  architecture_guardian:
    description: "Reviews architecture compliance of generated code"
    provider: anthropic
    physical_model: "claude-sonnet-4-6"
    model_version: "sonnet-4-6"
    temperature: 0.0
    max_tokens: 2048
    env_override: null

  reviewer_agent:
    description: "Independent review of diff vs story contract"
    provider: anthropic
    physical_model: "claude-sonnet-4-6"
    model_version: "sonnet-4-6"
    temperature: 0.0
    max_tokens: 4096
    env_override: null

  fast_lint:
    description: "Quick lint/trivial fix suggestions"
    provider: anthropic
    physical_model: "claude-haiku-4-5-20251001"
    model_version: "haiku-4-5"
    temperature: 0.0
    max_tokens: 1024
    env_override: null

# ---------------------------------------------------------------------------
# PROMPT REGISTRY
# Prompts are versioned. Changing a prompt requires bumping version.
# prompt_id is referenced in execution state for reproducibility.
# ---------------------------------------------------------------------------
prompts:

  implement_story_v1:
    prompt_id: "implement_story_v1"
    version: "1.0.0"
    role: story_implementer
    description: "Full story implementation prompt sent to local SLM"
    template_file: "scripts/local_model.py::build_implement_prompt"
    schema_version: "1.0"
    notes: "Injects story contract + architecture context + FILE: block format"

  fix_story_v1:
    prompt_id: "fix_story_v1"
    version: "1.0.0"
    role: story_implementer
    description: "Fix-loop prompt with CI failure output"
    template_file: "scripts/local_model.py::build_fix_prompt"
    schema_version: "1.0"

  architecture_review_v1:
    prompt_id: "architecture_review_v1"
    version: "1.0.0"
    role: architecture_guardian
    description: "Reviews generated files for architecture invariant compliance"
    template_file: "inline — orchestrator step 7"
    schema_version: "1.0"

# ---------------------------------------------------------------------------
# CONFIGURATION VERSIONS
# When configuration changes that would affect execution outcomes,
# bump configuration_version.
# ---------------------------------------------------------------------------
configuration:
  configuration_version: "1.0.0"
  architecture_rules_version: "1.0.0"
  retry_policy_version: "1.0.0"
  risk_level_schema_version: "1.0.0"
